<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="#fbbf24" stroke="#1f2937" stroke-width="4"/>
  
  <!-- Cute Octopus Head -->
  <path d="M16 33 C16 19, 48 19, 48 33 C48 39, 46 45, 46 45 L18 45 C18 45, 16 39, 16 33 Z" fill="#ec4899" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Tentacles at bottom -->
  <path d="M17 45 Q20 51 24 45 Q28 51 32 45 Q36 51 40 45 Q44 51 47 45" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  <path d="M17 45 Q20 51 24 45 Q28 51 32 45 Q36 51 40 45 Q44 51 47 45" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Big Friendly Toon Eyes -->
  <ellipse cx="26" cy="31" rx="4.5" ry="5.5" fill="#1f2937"/>
  <circle cx="27.5" cy="29.5" r="2" fill="#ffffff"/>
  
  <ellipse cx="38" cy="31" rx="4.5" ry="5.5" fill="#1f2937"/>
  <circle cx="39.5" cy="29.5" r="2" fill="#ffffff"/>
  
  <!-- Rosy Cheeks -->
  <circle cx="21" cy="35" r="2.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="43" cy="35" r="2.5" fill="#f43f5e" opacity="0.6"/>
  
  <!-- Happy Smile -->
  <path d="M29 36 Q32 39 35 36" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Little Grad Cap -->
  <polygon points="32,12 43,17 32,22 21,17" fill="#3b82f6" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M43 17 L44 23" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="23.5" r="1.5" fill="#f59e0b"/>
</svg>
